name: Test and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Rust formatting and test
        run: |
          cargo fmt --check
          cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact cases with SimPy
        run: |
          cargo build --release --locked
          python -m pip install -r verification/sne-2026/requirements.txt
          python verification/sne-2026/reference_simpy.py --deterministic-only
      - name: Build static site and check shared runtime
        run: |
          python3 scripts/build.py
          node scripts/test-wasm.mjs
          node --check web/app.js
          node --check web/worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
