[package]
name = "qrunap2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An evidence-led, educational subset of QNAP2 in Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
